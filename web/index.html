<!doctype html>
<html lang="ru" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Хиагда — учёт номерного фонда</title>
		<script>
			// Тема до первой отрисовки, без вспышки: сохранённая, иначе как в системе
			try {
				var t = localStorage.getItem("noch_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
				document.documentElement.setAttribute("data-theme", t)
			} catch (e) {}
		</script>
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#16181c" />
		<meta name="mobile-web-app-capable" content="yes" />

		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="preconnect" href="https://rsms.me" />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
	</head>
