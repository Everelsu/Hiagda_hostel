<!DOCTYPE html>
<html lang="ru" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Найти свой номер — NochOtel</title>
		<link rel="preconnect" href="https://rsms.me" />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		<link rel="stylesheet" href="/css/style.css" />
		<style>
			.kiosk {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 4vh 20px 40px;
				background: var(--brand-gradient-bg), var(--color-bg);
			}
			.kiosk .head {
				text-align: center;
				margin-bottom: 2rem;
			}
			.kiosk .brand-mark {
				font-size: 2rem;
				justify-content: center;
			}
			.kiosk .brand-mark .dot {
				width: 1.6rem;
				height: 1.6rem;
			}
			.kiosk h1 {
				font-size: 2rem;
				margin: 1.5rem 0 0.25rem;
			}
			.kiosk .sub {
				color: var(--color-secondary);
				font-size: 1.1rem;
			}
			.search-box {
				display: flex;
				gap: var(--gap-sm);
				width: 100%;
				max-width: 640px;
			}
			.search-box input {
				font-size: 1.4rem;
				padding: 1rem 1.25rem;
				height: auto;
			}
			.search-box .btn {
				font-size: 1.3rem;
				padding: 0 1.75rem;
			}
			.result-wrap {
				width: 100%;
				max-width: 760px;
				margin-top: 2rem;
				display: grid;
				gap: var(--gap-lg);
			}
			.pick-list {
				display: grid;
				gap: var(--gap-sm);
			}
			.pick-item {
				display: flex;
				align-items: center;
				gap: 1rem;
				text-align: left;
				font-size: 1.15rem;
				padding: 1rem 1.25rem;
				background: var(--surface-3);
				border: 1px solid var(--surface-4);
				border-radius: var(--radius-lg);
				color: var(--color-contrast);
				cursor: pointer;
			}
			.pick-item:hover {
				border-color: var(--color-green);
				background: var(--surface-4);
			}
			.pick-ava {
				font-size: 1.8rem;
				line-height: 1;
				flex-shrink: 0;
			}
			.pick-text {
				display: flex;
				flex-direction: column;
			}
			.pick-name {
				font-weight: var(--font-weight-bold);
			}
			.pick-item small {
				color: var(--color-secondary);
			}
			.kiosk-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.66);
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
				z-index: 50;
			}
			.kiosk-pick {
				width: 100%;
				max-width: 560px;
				max-height: 86vh;
				overflow-y: auto;
				background: var(--surface-3);
				border: 1px solid var(--surface-4);
				border-radius: var(--radius-xl);
				box-shadow: var(--shadow-floating);
				padding: 1.75rem;
				display: grid;
				gap: 1.25rem;
			}
			.pick-head {
				margin: 0;
				font-size: 1.3rem;
				font-weight: var(--font-weight-bold);
				color: var(--color-contrast);
				text-align: center;
			}
			.pick-cancel {
				justify-self: center;
				font-size: 1.1rem;
			}
			.res-card {
				background: var(--surface-3);
				border: 1px solid var(--surface-4);
				border-radius: var(--radius-xl);
				padding: 2rem;
				box-shadow: var(--shadow-floating);
				text-align: center;
			}
			.res-card .name {
				font-size: 1.3rem;
				color: var(--color-secondary);
			}
			.res-card .room-no {
				font-size: 3.5rem;
				font-weight: var(--font-weight-extrabold);
				color: var(--color-green);
				margin: 0.5rem 0;
			}
			.res-card .meta {
				font-size: 1.15rem;
				color: var(--color-base);
			}
			.res-card .status {
				display: inline-block;
				margin-top: 1rem;
				padding: 0.4rem 1rem;
				border-radius: var(--radius-max);
				font-weight: var(--font-weight-bold);
				color: #000;
			}
			.map-title {
				font-weight: var(--font-weight-bold);
				color: var(--color-contrast);
				margin: 0 0 var(--gap-md);
				text-align: center;
				font-size: 1.15rem;
			}
			.map-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
				gap: var(--gap-md);
			}
			.map-room {
				background: var(--surface-4);
				border: 2px solid transparent;
				border-radius: var(--radius-md);
				padding: 1rem 0.5rem;
				text-align: center;
				font-weight: var(--font-weight-bold);
				color: var(--color-secondary);
			}
			.map-room.target {
				background: var(--color-green);
				color: #000;
				border-color: var(--color-green);
				box-shadow: 0 0 0 4px var(--color-green-bg);
				animation: pulse 1.4s ease-in-out infinite;
			}
			.map-room.target .pin {
				display: block;
				font-size: 0.8rem;
				font-weight: var(--font-weight-bold);
			}
			@keyframes pulse {
				0%, 100% { box-shadow: 0 0 0 4px var(--color-green-bg); }
				50% { box-shadow: 0 0 0 10px transparent; }
			}
			.empty-note {
				text-align: center;
				font-size: 1.15rem;
			}
			.staff-link {
				position: fixed;
				bottom: 14px;
				right: 18px;
				color: var(--color-secondary);
				font-size: 0.85rem;
				text-decoration: none;
				opacity: 0.6;
			}
		</style>
	</head>
	<body>
		<div class="kiosk">
			<div class="head">
				<div class="brand-mark"><span class="dot"></span> NochOtel</div>
				<h1>Найдите свой номер</h1>
				<p class="sub">Введите ФИО или табельный номер</p>
			</div>

			<form class="search-box" id="kiosk-form">
				<input id="kiosk-q" placeholder="Например: Иванов или А-77" autocomplete="off" autofocus />
				<button class="btn btn-primary" type="submit">Найти</button>
			</form>

			<div class="result-wrap" id="kiosk-result"></div>
		</div>
		<div id="kiosk-modal-root"></div>
		<a class="staff-link" href="/">Вход для персонала</a>
		<script src="/js/kiosk.js"></script>
	</body>
</html>
